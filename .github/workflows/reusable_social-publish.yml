name: Social Publish (reusable)
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      drafts_dir:
        type: string
        default: "_social_drafts/"
      published_dir:
        type: string
        default: "_social_published/"
      schedule_path:
        type: string
        default: "_data/social_schedule.yml"
      config_path:
        type: string
        default: "_data/social_config.yml"
      # Common includes submodule
      use_common_includes:
        description: 'Clone BrightSoftwares/jekyll-theme-common-includes'
        type: boolean
        required: false
        default: true
      common_includes_path:
        description: 'Path for common includes'
        type: string
        required: false
        default: '_includes/common'
      dry_run:
        type: boolean
        default: false
    secrets:
      LINKEDIN_ACCESS_TOKEN:
        required: true
      LINKEDIN_ORG_URN:
        required: true
      FACEBOOK_PAGE_ACCESS_TOKEN:
        required: true
      FACEBOOK_PAGE_ID:
        required: true
      submodule_pat:
        description: 'Fine-grained GitHub PAT (Contents: Read-only) with access to the private submodule repos (e.g. jekyll-theme-common-includes, shared-site-data). Preferred over submodule_ssh_key — works across multiple repos with a single token. Falls back to submodule_ssh_key if unset or if the PAT clone fails.'
        required: false
      submodule_ssh_key:
        description: 'SSH deploy key for private submodule access. Fallback only, kept during migration to submodule_pat — remove once every caller repo has submodule_pat configured.'
        required: false
    outputs:
      published_count:
        description: "Number of posts successfully published"
        value: ${{ jobs.publish.outputs.published_count }}
      published_slugs:
        description: "Comma-separated list of published slugs"
        value: ${{ jobs.publish.outputs.published_slugs }}
jobs:
  publish:
    runs-on: "${{ vars.RUNNER_LABEL || 'self-hosted' }}"
    permissions:
      contents: write
    outputs:
      published_count: ${{ steps.pub.outputs.published_count }}
      published_slugs: ${{ steps.pub.outputs.published_slugs }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4
        # with:
        #   submodules: true
        #   token: ${{ github.token }}

      - name: Checkout declared submodules
        if: ${{ inputs.use_common_includes }}
        env:
          SUBMODULE_PAT: ${{ secrets.submodule_pat }}
          SUBMODULE_SSH_KEY: ${{ secrets.submodule_ssh_key }}
          COMMON_INCLUDES_PATH: ${{ inputs.common_includes_path }}
        run: |
          set -euo pipefail

          # Set up the SSH deploy key as a fallback path (still used if no PAT,
          # or if the PAT clone fails for a given repo).
          if [ -n "${SUBMODULE_SSH_KEY:-}" ]; then
            mkdir -p ~/.ssh
            echo "${SUBMODULE_SSH_KEY}" > ~/.ssh/submodule_deploy_key
            chmod 600 ~/.ssh/submodule_deploy_key
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/submodule_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
          fi

          clone_one() {
            # $1 = destination path, $2 = https:// clone URL (casing preserved exactly as declared)
            local dest="$1"
            local https_url="$2"
            case "$https_url" in
              *.git) : ;;
              *) https_url="${https_url}.git" ;;
            esac

            echo "Checking out submodule -> ${dest} from ${https_url}"
            rm -rf "${dest}"
            mkdir -p "$(dirname "${dest}")"

            # 1) Preferred: PAT over HTTPS via an auth header, so the token never
            #    appears in the URL (and thus never in git's own error output).
            #    Works for both private and public repos with the same token.
            if [ -n "${SUBMODULE_PAT:-}" ]; then
              local basic_auth
              basic_auth=$(printf 'x-access-token:%s' "${SUBMODULE_PAT}" | base64 -w0)
              if git -c http.extraHeader="AUTHORIZATION: basic ${basic_auth}" \
                  clone --depth 1 "${https_url}" "${dest}"; then
                return 0
              fi
              echo "PAT clone failed for ${dest}, falling back..."
              rm -rf "${dest}"
            fi

            # 2) Fallback: SSH deploy key (legacy path, being phased out).
            if [ -n "${SUBMODULE_SSH_KEY:-}" ]; then
              local ssh_url
              ssh_url=$(echo "$https_url" | sed -E 's#^https://github\.com/#git@github.com:#')
              echo "Falling back to SSH for ${dest} -> ${ssh_url}"
              git clone --depth 1 "${ssh_url}" "${dest}"
              return $?
            fi

            # 3) Last resort: anonymous HTTPS clone. Only works for public repos.
            echo "No PAT or SSH key available, attempting anonymous clone for ${dest}"
            git clone --depth 1 "${https_url}" "${dest}"
          }

          if [ -f .gitmodules ]; then
            echo "Found .gitmodules — checking out every declared submodule."
            found_any=0
            while read -r key path; do
              [ -z "${key}" ] && continue
              found_any=1
              name=$(echo "${key}" | sed -E 's/^submodule\.(.*)\.path$/\1/')
              url=$(git config -f .gitmodules --get "submodule.${name}.url")
              clone_one "${path}" "${url}"
            done < <(git config -f .gitmodules --get-regexp '^submodule\..*\.path$')
            if [ "${found_any}" -eq 0 ]; then
              echo ".gitmodules exists but declares no submodules — falling back to legacy common-includes checkout."
              clone_one "${COMMON_INCLUDES_PATH}" "https://github.com/BrightSoftwares/jekyll-theme-common-includes"
            fi
          else
            echo "No .gitmodules in caller repo — falling back to legacy common-includes checkout."
            clone_one "${COMMON_INCLUDES_PATH}" "https://github.com/BrightSoftwares/jekyll-theme-common-includes"
          fi

          rm -f ~/.ssh/submodule_deploy_key
      
      - name: Checkout blogpost-tools scripts
        uses: actions/checkout@v4
        with:
          repository: brightsoftwares/blogpost-tools
          path: _blogpost_tools
          token: ${{ github.token }}
      - name: Verify Python (system interpreter — self-hosted runner; actions/setup-python's build manifest doesn't cover this runner's OS yet)
        run: python3 --version
      - name: Create virtualenv and install dependencies
        run: |
          python3 -m venv .venv-social-publish
          source .venv-social-publish/bin/activate
          python -m pip install --upgrade pip
          pip install -r _blogpost_tools/scripts/social/requirements.txt
      - name: Publish approved drafts
        id: pub
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_URN: ${{ secrets.LINKEDIN_ORG_URN }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          source .venv-social-publish/bin/activate
          python _blogpost_tools/scripts/social/publish_main.py \
            --drafts-dir "${{ inputs.drafts_dir }}" \
            --published-dir "${{ inputs.published_dir }}" \
            --schedule-path "${{ inputs.schedule_path }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Cleanup virtualenv
        if: always()
        run: rm -rf .venv-social-publish
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.published_dir }}" "${{ inputs.schedule_path }}" social-calendar.md || true
          git diff --staged --quiet || git commit -m "social: publish $(find ${{ inputs.published_dir }} -name '*.yml' 2>/dev/null | wc -l | tr -d ' ') post(s) [skip ci]"
          git push
