name: jekyll-fleet-tests

# Unit tests (mocked HTTP, no network) for scripts/jekyll_fleet/ + YAML sanity of
# the fleet workflows and the Dependabot template.
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/jekyll_fleet/**'
      - 'tests/jekyll_fleet/**'
      - '.github/workflows/*jekyll-dependency-audit*.yml'
      - '.github/workflows/jekyll-fleet-tests.yml'
      - '.github/workflows/fleet-dependabot-sweeper.yml'
      - '.github/workflows/jekyll-version-drift-check.yml'
  push:
    branches: ['**']
    paths:
      - 'scripts/jekyll_fleet/**'
      - 'tests/jekyll_fleet/**'
      - '.github/workflows/*jekyll-dependency-audit*.yml'
      - '.github/workflows/jekyll-fleet-tests.yml'
      - '.github/workflows/fleet-dependabot-sweeper.yml'
      - '.github/workflows/jekyll-version-drift-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest pyyaml
      - run: pytest tests/jekyll_fleet -v --tb=short
