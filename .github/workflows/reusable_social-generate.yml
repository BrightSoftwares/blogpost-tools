name: Social Generate (reusable)
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      posts_dir:
        type: string
        default: "_posts/en/"
      drafts_dir:
        type: string
        default: "_social_drafts/"
      schedule_path:
        type: string
        default: "_data/social_schedule.yml"
      config_path:
        type: string
        default: "_data/social_config.yml"
      target_slug:
        type: string
        required: false
        default: ""
      dry_run:
        type: boolean
        default: false
      # Possible values: "direct" (default — SAM returns the PNGs inline and
      # they are committed under images_dir, so they are reviewable in the
      # generated PR) | "cloudinary" (CDN URLs; requires CLOUDINARY_* env on
      # the SAM service — missing on Render since 2026-09, root cause of every
      # failed run e.g. corporate-website run 36887345595).
      sam_storage:
        type: string
        default: "direct"
      # Repo-relative folder for committed social card PNGs (direct storage).
      images_dir:
        type: string
        default: "assets/images/social/"
      # Ref of brightsoftwares/blogpost-tools whose scripts are run. Keep
      # "main" in production callers; set to a branch only to test a change.
      tools_ref:
        type: string
        default: "main"
      # Ref of the caller repo the posts/schedule are read from. Empty =
      # the caller's default branch, so a run dispatched from a feature
      # branch still generates against published content and opens its
      # PR against the default branch (PR #98 in corporate-website was
      # opened against claude/automated-work because of this).
      content_ref:
        type: string
        default: ""
    secrets:
      SMART_ASSETS_API_KEY:
        required: true
      GH_TOKEN:
        required: true
jobs:
  generate:
    # runs-on: "${{ vars.RUNNER_LABEL || 'self-hosted' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ inputs.content_ref || github.event.repository.default_branch }}
          token: ${{ secrets.GH_TOKEN || github.token }}
          persist-credentials: false
          
      - name: Checkout blogpost-tools scripts
        uses: actions/checkout@v4
        with:
          repository: brightsoftwares/blogpost-tools
          path: _blogpost_tools
          ref: ${{ inputs.tools_ref }}
          token: ${{ secrets.GH_TOKEN || github.token }}
          
      - name: Verify Python (system interpreter — self-hosted runner; actions/setup-python's build manifest doesn't cover this runner's OS yet)
        run: python3 --version
        
      - name: Create virtualenv and install dependencies
        run: |
          python3 -m venv .venv-social-generate
          source .venv-social-generate/bin/activate
          python -m pip install --upgrade pip
          pip install -r _blogpost_tools/scripts/social/requirements.txt
          
      - name: Warm up Smart Assets Manager API
        run: |
          SAM_API_URL="${SAM_API_URL:-https://smart-assets-manager.onrender.com}"
          echo "Warming up $SAM_API_URL ..."
          MAX_ATTEMPTS=15
          SLEEP_SECONDS=10
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            RESPONSE="$(curl -s -m 15 "$SAM_API_URL" || true)"
            if echo "$RESPONSE" | grep -q '"message"[[:space:]]*:[[:space:]]*"Smart Assets Manager API"'; then
              echo "✅ API is warm (attempt $i/$MAX_ATTEMPTS)"
              echo "$RESPONSE"
              exit 0
            fi
            echo "⏳ Attempt $i/$MAX_ATTEMPTS: not warm yet, retrying in ${SLEEP_SECONDS}s..."
            sleep "$SLEEP_SECONDS"
          done
          echo "⚠️ API did not report warm status after $MAX_ATTEMPTS attempts — proceeding anyway, generate step may fail"
          
      - name: Generate next post
        id: gen
        env:
          SMART_ASSETS_API_KEY: ${{ secrets.SMART_ASSETS_API_KEY }}
          SAM_STORAGE: ${{ inputs.sam_storage }}
        run: |
          source .venv-social-generate/bin/activate
          python _blogpost_tools/scripts/social/generate_main.py \
            --posts-dir "${{ inputs.posts_dir }}" \
            --drafts-dir "${{ inputs.drafts_dir }}" \
            --schedule-path "${{ inputs.schedule_path }}" \
            --config-path "${{ inputs.config_path }}" \
            --images-dir "${{ inputs.images_dir }}" \
            ${{ inputs.target_slug != '' && format('--target-slug "{0}"', inputs.target_slug) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}
            
      - name: Cleanup virtualenv
        if: always()
        run: rm -rf .venv-social-generate

      - name: Open PR
        # dry_run means "generate the draft but do not open a PR" (2026-10-08: without
        # this guard create-pull-request failed on 'assets/images/social/**' pathspec).
        if: steps.gen.outputs.has_changes == 'true' && !inputs.dry_run
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}
          branch: social/schedule-${{ steps.gen.outputs.slug }}
          title: "social: schedule ${{ steps.gen.outputs.slug }} for ${{ steps.gen.outputs.scheduled_date }}"
          body: |
            Auto-generated draft post for **${{ steps.gen.outputs.slug }}**.

            **LinkedIn preview:**
            ```
            ${{ steps.gen.outputs.linkedin_preview }}
            ```

            **Facebook preview:**
            ```
            ${{ steps.gen.outputs.facebook_preview }}
            ```

            **Image URL used for publishing:** ${{ steps.gen.outputs.image_url }}

            **Visual validation:** open the **Files changed** tab of this PR — the
            generated cards are committed under `${{ inputs.images_dir }}`
            (`${{ steps.gen.outputs.image_paths }}`) and render inline there.

            To approve: edit the draft YAML in `${{ inputs.drafts_dir }}`, set `status: approved`, then merge this PR.
            Merging a draft with `status: draft` publishes nothing (Social Publish only posts `approved` drafts).
          add-paths: |
            ${{ inputs.drafts_dir }}**
            ${{ inputs.images_dir }}**
            ${{ inputs.schedule_path }}
            social-calendar.md
