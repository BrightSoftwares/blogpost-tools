name: Reusable SEO HTML Analysis

on:
  workflow_call:
    inputs:
      build_dir:
        required: false
        type: string
        default: "./build"
      pre_build_commands:
        required: false
        type: string
        default: "apk --update add ruby-dev imagemagick imagemagick-dev"
      html_analysis_output:
        required: false
        type: string
        default: "/github/workspace/_drafts/html_analysis.txt"
    secrets:
      GH_TOKEN:
        required: false
      submodule_pat:
        description: 'Fine-grained GitHub PAT (Contents: Read-only) with access to the private submodule repos (e.g. jekyll-theme-common-includes, shared-site-data). Preferred over submodule_ssh_key — works across multiple repos with a single token. Falls back to submodule_ssh_key if unset or if the PAT clone fails.'
        required: false
      submodule_ssh_key:
        description: 'SSH deploy key for private submodule access. Fallback only, kept during migration to submodule_pat — remove once every caller repo has submodule_pat configured.'
        required: false
  workflow_dispatch:
    inputs:
      build_dir:
        required: false
        type: string
        default: "./build"
      pre_build_commands:
        required: false
        type: string
        default: "apk --update add ruby-dev imagemagick imagemagick-dev"
      html_analysis_output:
        required: false
        type: string
        default: "/github/workspace/_drafts/html_analysis.txt"

jobs:
  html_analysis:
    runs-on: "${{ vars.RUNNER_LABEL || 'self-hosted' }}"
    timeout-minutes: 30
    concurrency:
      group: seo-html-analysis-${{ github.repository }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          token: ${{ secrets.GH_TOKEN || github.token }}

      # Fixes seo-html-analysis-submodule-fix-1 (2026-09-16): the previous
      # `submodules: recursive` checkout used a token scoped only to this
      # calling repo, which cannot clone the separate private submodule repos
      # (jekyll-theme-common-includes, shared-site-data) — every scheduled run
      # against foolywise.com/keke.li failed. Mirrors the proven PAT-based
      # pattern already shipped in reusable_jekyll_build_and_deploy.yml.
      - name: Checkout declared submodules
        env:
          SUBMODULE_PAT: ${{ secrets.submodule_pat }}
          SUBMODULE_SSH_KEY: ${{ secrets.submodule_ssh_key }}
        run: |
          set -euo pipefail

          if [ -n "${SUBMODULE_SSH_KEY:-}" ]; then
            mkdir -p ~/.ssh
            echo "${SUBMODULE_SSH_KEY}" > ~/.ssh/submodule_deploy_key
            chmod 600 ~/.ssh/submodule_deploy_key
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/submodule_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
          fi

          clone_one() {
            # $1 = destination path, $2 = https:// clone URL (casing preserved exactly as declared)
            local dest="$1"
            local https_url="$2"
            case "$https_url" in
              *.git) : ;;
              *) https_url="${https_url}.git" ;;
            esac

            echo "Checking out submodule -> ${dest} from ${https_url}"
            rm -rf "${dest}"
            mkdir -p "$(dirname "${dest}")"

            # 1) Preferred: PAT over HTTPS via an auth header, so the token never
            #    appears in the URL (and thus never in git's own error output).
            if [ -n "${SUBMODULE_PAT:-}" ]; then
              local basic_auth
              basic_auth=$(printf 'x-access-token:%s' "${SUBMODULE_PAT}" | base64 -w0)
              if git -c http.extraHeader="AUTHORIZATION: basic ${basic_auth}" \
                  clone --depth 1 "${https_url}" "${dest}"; then
                return 0
              fi
              echo "PAT clone failed for ${dest}, falling back..."
              rm -rf "${dest}"
            fi

            # 2) Fallback: SSH deploy key (legacy path, being phased out).
            if [ -n "${SUBMODULE_SSH_KEY:-}" ]; then
              local ssh_url
              ssh_url=$(echo "$https_url" | sed -E 's#^https://github\.com/#git@github.com:#')
              echo "Falling back to SSH for ${dest} -> ${ssh_url}"
              git clone --depth 1 "${ssh_url}" "${dest}"
              return $?
            fi

            # 3) Last resort: anonymous HTTPS clone. Only works for public repos.
            echo "No PAT or SSH key available, attempting anonymous clone for ${dest}"
            git clone --depth 1 "${https_url}" "${dest}"
          }

          if [ -f .gitmodules ]; then
            echo "Found .gitmodules — checking out every declared submodule."
            while read -r key path; do
              [ -z "${key}" ] && continue
              name=$(echo "${key}" | sed -E 's/^submodule\.(.*)\.path$/\1/')
              url=$(git config -f .gitmodules --get "submodule.${name}.url")
              clone_one "${path}" "${url}"
            done < <(git config -f .gitmodules --get-regexp '^submodule\..*\.path$')
          else
            echo "No .gitmodules in caller repo — nothing to check out."
          fi

          rm -f ~/.ssh/submodule_deploy_key

      - uses: actions/cache@v5
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile') }}
          restore-keys: |
            ${{ runner.os }}-gems

      - uses: BrightSoftwares/blogpost-tools/jekyll-action@main
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}
          pre_build_commands: ${{ inputs.pre_build_commands }}
          build_dir: ${{ inputs.build_dir }}

      - name: Check HTML
        uses: fullbright/htmlproofer@master
        id: htmlproofer
        with:
          directory: "${{ inputs.build_dir }}"
          arguments: --assume-extension .html
          output_file: ${{ inputs.html_analysis_output }}
        continue-on-error: true

      - name: Commit changes if any
        run: |
          CHANGES_EXIST="$(git status --porcelain | wc -l)"
          if [ "$CHANGES_EXIST" -eq 0 ]; then
            echo "No changes to commit"
          else
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add .
            git commit -m "generated and changed files"
            DUPHDR=$(git config --local --get-all http.https://github.com/.extraheader 2>/dev/null | wc -l)
            [ "$DUPHDR" -gt 1 ] && git config --unset-all http.https://github.com/.extraheader
            git pull --rebase
            git push
          fi
