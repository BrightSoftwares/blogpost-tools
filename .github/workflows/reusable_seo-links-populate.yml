name: Reusable SEO Links Populate

# 2026-09-11: `mode` input added, and `--force` is no longer the only way to
# touch a post that already has links.
#
# Until 2026-09-11 the "skip posts that already have seo.links" guard in
# seo_links_populator.py never fired (the flat frontmatter parser cannot see a
# nested `seo.links`), so EVERY weekly scheduled run silently rewrote EVERY
# post's links even with force=false. That is how
# `2026-11-09-we-built-a-crm-feature-on-ourselves-first-...md` in
# corporate-website lost its hand-picked link and gained the English pronoun
# "we" (Q7478101). The guard now works, which means:
#
#   mode: populate            → only posts with NO seo.links are touched (default)
#   mode: replace-irrelevant  → existing links are resolved against Wikidata,
#                               the relevant ones are kept, the rest replaced
#   mode: force               → every post is recomputed from scratch
#
# Use `reusable_seo-links-audit.yml` first to see what would change.

on:
  workflow_call:
    inputs:
      posts_dir:
        description: "Directory containing Jekyll posts to scan"
        required: false
        type: string
        default: "en/_posts"
      drafts_dir:
        description: "Directory containing Jekyll drafts to scan"
        required: false
        type: string
        default: "en/_drafts/400_refined_content"
      min_links:
        description: "Minimum Wikidata links per post (never padded with irrelevant items)"
        required: false
        type: number
        default: 2
      max_links:
        description: "Maximum Wikidata links per post"
        required: false
        type: number
        default: 4
      mode:
        description: "populate | replace-irrelevant | force"
        required: false
        type: string
        default: "populate"
      force:
        description: "DEPRECATED — use mode: force. Kept so existing callers keep working."
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Print what would change without writing or committing"
        required: false
        type: boolean
        default: false
      scan_posts:
        description: "Scan published posts directory"
        required: false
        type: boolean
        default: true
      scan_drafts:
        description: "Scan drafts directory"
        required: false
        type: boolean
        default: true
    secrets:
      GH_TOKEN:
        required: false

jobs:
  populate-seo-links:
    runs-on: "${{ vars.RUNNER_LABEL || 'self-hosted' }}"
    timeout-minutes: 30
    concurrency:
      group: seo-links-${{ github.repository }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          repository: BrightSoftwares/blogpost-tools
          path: _blogpost-tools
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Verify Python (system interpreter — self-hosted runner; actions/setup-python's build manifest doesn't cover this runner's OS yet)
        run: python3 --version

      - name: Populate SEO links
        run: |
          MODE="${{ inputs.mode }}"
          if [ "${{ inputs.force }}" = "true" ] && [ "$MODE" = "populate" ]; then
            echo "::warning::inputs.force is deprecated — treating this run as mode: force"
            MODE="force"
          fi

          MODE_FLAG=""
          case "$MODE" in
            populate)           MODE_FLAG="" ;;
            replace-irrelevant) MODE_FLAG="--replace-irrelevant" ;;
            force)              MODE_FLAG="--force" ;;
            *) echo "::error::unknown mode '$MODE' (expected populate|replace-irrelevant|force)"; exit 1 ;;
          esac

          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi

          DIRS=""
          if [ "${{ inputs.scan_posts }}" = "true" ] && [ -d "${{ inputs.posts_dir }}" ]; then
            DIRS="$DIRS --dir ${{ inputs.posts_dir }}"
          else
            echo "Posts directory '${{ inputs.posts_dir }}' not scanned."
          fi
          if [ "${{ inputs.scan_drafts }}" = "true" ] && [ -d "${{ inputs.drafts_dir }}" ]; then
            DIRS="$DIRS --dir ${{ inputs.drafts_dir }}"
          else
            echo "Drafts directory '${{ inputs.drafts_dir }}' not scanned."
          fi

          if [ -z "$DIRS" ]; then
            echo "::warning::Neither posts_dir nor drafts_dir exists in this repository — nothing to do."
            exit 0
          fi

          python3 _blogpost-tools/scripts/seo_links_populator.py \
            $DIRS \
            --min-links ${{ inputs.min_links }} \
            --max-links ${{ inputs.max_links }} \
            $MODE_FLAG $DRY_FLAG

      - name: Commit changes
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude)_blogpost-tools'
          if git diff --cached --quiet; then
            echo "No SEO link changes to commit."
          else
            git commit -m "chore(seo): populate seo.links with relevant Wikidata entities"
            git push
          fi

      - name: Cleanup
        if: always()
        run: rm -rf _blogpost-tools
