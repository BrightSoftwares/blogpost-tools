name: Reusable - Jekyll dependency audit

# Audits Gemfile.lock with bundler-audit and (when a Pipfile.lock exists) the
# pinned Python deps with pip-audit. Fails the job when a finding is at or above
# `fail-on`. Reads lockfiles only: no `bundle install`, so it is fast and cannot
# be broken by an unbuildable Gemfile. Findings go to the job summary.
#
# Notes: bundler-audit severity comes from the advisory DB's `criticality`; entries
# with none are treated as `unknown-as` (default medium). pip-audit reports no
# severity, so every pip finding counts as `pip-severity` (default high).
#
# Caller: see .github/workflows/examples/jekyll-dependency-audit.yml
on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing Gemfile.lock / Pipfile.lock
        type: string
        default: '.'
      ruby-version:
        type: string
        default: '3.3'
      python-version:
        type: string
        default: '3.12'
      fail-on:
        description: none | low | medium | high | critical
        type: string
        default: high
      unknown-as:
        type: string
        default: medium
      pip-severity:
        type: string
        default: high
      tools-ref:
        description: blogpost-tools ref that provides scripts/jekyll_fleet
        type: string
        default: main

permissions:
  contents: read

jobs:
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch audit helper
        uses: actions/checkout@v4
        with:
          repository: BrightSoftwares/blogpost-tools
          ref: ${{ inputs.tools-ref }}
          path: .blogpost-tools
          sparse-checkout: scripts/jekyll_fleet

      - name: Detect lockfiles
        id: detect
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -f Gemfile.lock ]; then echo "gemfile_lock=true" >> "$GITHUB_OUTPUT"; else
            echo "gemfile_lock=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Gemfile.lock in ${{ inputs.working-directory }}: nothing to bundler-audit"
          fi
          # Every Pipfile.lock (they often live in a sub-folder such as _data/cleanup_scripts),
          # ignoring vendored/virtualenv trees and the helper checkout.
          find . -name Pipfile.lock \
            -not -path './.blogpost-tools/*' -not -path '*/vendor/*' -not -path '*/node_modules/*' \
            -not -path '*/.venv/*' -not -path '*/venv/*' -not -path '*/site-packages/*' | sort > "$RUNNER_TEMP/pipfile-locks.txt"
          if [ -s "$RUNNER_TEMP/pipfile-locks.txt" ]; then echo "pipfile_lock=true" >> "$GITHUB_OUTPUT"; else echo "pipfile_lock=false" >> "$GITHUB_OUTPUT"; fi
          echo "Pipfile.lock files:"; cat "$RUNNER_TEMP/pipfile-locks.txt"

      - name: Set up Ruby
        if: steps.detect.outputs.gemfile_lock == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby-version }}

      - name: bundler-audit
        if: steps.detect.outputs.gemfile_lock == 'true'
        working-directory: ${{ inputs.working-directory }}
        env:
          FAIL_ON: ${{ inputs.fail-on }}
          UNKNOWN_AS: ${{ inputs.unknown-as }}
        run: |
          gem install bundler-audit --no-document
          bundle-audit update
          # bundle-audit exits 1 when it finds vulnerabilities; the JSON is judged below.
          bundle-audit check --format json > "$RUNNER_TEMP/bundle-audit.json" || true
          test -s "$RUNNER_TEMP/bundle-audit.json" || { echo "bundle-audit produced no output"; exit 2; }
          python3 "$GITHUB_WORKSPACE/.blogpost-tools/scripts/jekyll_fleet/audit_report.py" bundler \
            --input "$RUNNER_TEMP/bundle-audit.json" --fail-on "$FAIL_ON" --unknown-as "$UNKNOWN_AS"

      - name: Set up Python
        if: steps.detect.outputs.pipfile_lock == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: pip-audit
        if: steps.detect.outputs.pipfile_lock == 'true'
        working-directory: ${{ inputs.working-directory }}
        env:
          FAIL_ON: ${{ inputs.fail-on }}
          PIP_SEVERITY: ${{ inputs.pip-severity }}
        run: |
          python -m pip install --quiet pip-audit
          helper="$GITHUB_WORKSPACE/.blogpost-tools/scripts/jekyll_fleet/audit_report.py"
          rc=0
          while read -r lock; do
            echo "::group::pip-audit $lock"
            python "$helper" pipfile-to-requirements "$lock" > "$RUNNER_TEMP/requirements-audit.txt"
            rm -f "$RUNNER_TEMP/pip-audit.json"
            # pip-audit exits 1 on findings; the JSON is judged below.
            pip-audit -r "$RUNNER_TEMP/requirements-audit.txt" --no-deps --disable-pip \
              -f json -o "$RUNNER_TEMP/pip-audit.json" || true
            if [ ! -s "$RUNNER_TEMP/pip-audit.json" ]; then echo "pip-audit produced no output for $lock"; rc=2; echo "::endgroup::"; continue; fi
            echo "#### $lock" >> "$GITHUB_STEP_SUMMARY"
            python "$helper" pip --input "$RUNNER_TEMP/pip-audit.json" \
              --fail-on "$FAIL_ON" --pip-severity "$PIP_SEVERITY" || { [ "$rc" = 2 ] || rc=1; }
            echo "::endgroup::"
          done < "$RUNNER_TEMP/pipfile-locks.txt"
          exit "$rc"
