name: Publish Netlify deploy Docker image

on:
  push:
    paths:
      - 'action-netlify-deploy/**'
  workflow_dispatch:

env:
  SUBFOLDER: action-netlify-deploy

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    # Public repo: GitHub-hosted minutes are free; self-hosted jobs queued for 24h (2026-10-04 diagnosis).
    runs-on: ubuntu-latest
    #runs-on: self-hosted
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      
      - name: Log in to Docker Hub
        # Only publish from main: this image is :latest for every Netlify-deploying blog repo.
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata (tags, labels) for Docker
        id: metaapi
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: fullbright/action-netlify-deploy
          flavor: |
            latest=true
            prefix=
            suffix=
          tags: |
            type=schedule
            type=ref,event=tag,enable=true,prefix=,suffix=
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      
      - name: Build and push Docker image for API
        uses: docker/build-push-action@ad44023a93711e3deb337508980b4b5e9bcdc5dc
        with:
          context: "./${{ env.SUBFOLDER }}"
          file: ./${{ env.SUBFOLDER }}/Dockerfile.netlify
          # Branches build + load locally for the smoke test below; only main pushes.
          push: ${{ github.ref == 'refs/heads/main' }}
          load: ${{ github.ref != 'refs/heads/main' }}
          tags: ${{ steps.metaapi.outputs.tags }}
          labels: ${{ steps.metaapi.outputs.labels }}

      - name: Smoke test image (node + netlify-cli present)
        if: github.ref != 'refs/heads/main'
        run: |
          IMAGE="$(echo '${{ steps.metaapi.outputs.tags }}' | head -n1)"
          docker run --rm --entrypoint sh "$IMAGE" -c 'node --version && netlify --version'
          # Regression guard (2026-10-08): the deploy must not trigger a framework build.
          docker run --rm --entrypoint sh "$IMAGE" -c 'netlify deploy --help | grep -q -- "--no-build" && grep -q "netlify deploy --no-build" /entrypoint.sh'
